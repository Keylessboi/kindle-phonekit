# Path-based PR labeling. See https://github.com/actions/labeler.

extension:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/ext/**/*"]

dashboard:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/ext/dashboard/*"]

read-it-later:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/ext/reader/*"]

rss-reader:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/ext/feed/*"]

notes-todo:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/ext/notes/*"]

qr:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/ext/qr/*"]

xmpp:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/ext/xmpp/*"]

llm:
  - changed-files:
      - any-glob-to-any-file:
          - "extensions/phonekit/ext/llm/*"
          - "extensions/phonekit/ext/weblinks.sh"

menu:
  - changed-files:
      - any-glob-to-any-file: ["extensions/phonekit/menu.json"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/*"]

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**/*"
          - "marketing/**/*"