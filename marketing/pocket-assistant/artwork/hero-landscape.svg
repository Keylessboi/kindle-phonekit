<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <!-- Design tokens -->
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24262e"/>
      <stop offset="0.55" stop-color="#3a322c"/>
      <stop offset="1" stop-color="#171512"/>
    </linearGradient>
    <radialGradient id="lampglow" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#e8a95b" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e8a95b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8a95b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampcore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd691"/>
      <stop offset="1" stop-color="#e8a95b"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f2ec"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Dusk background -->
  <rect width="1600" height="900" fill="url(#dusk)"/>

  <!-- Warm lamp glow -->
  <rect width="1600" height="900" fill="url(#lampglow)"/>

  <!-- Window, far right (dusk blue) -->
  <rect x="1230" y="60" width="300" height="420" rx="10" fill="#14151c" opacity="0.6"/>
  <rect x="1260" y="90" width="120" height="150" fill="#2b3a52" opacity="0.85"/>
  <rect x="1400" y="90" width="100" height="150" fill="#26354b" opacity="0.85"/>
  <rect x="1260" y="260" width="120" height="150" fill="#223047" opacity="0.85"/>
  <rect x="1400" y="260" width="100" height="150" fill="#1d2a3f" opacity="0.85"/>
  <rect x="1383" y="90" width="3" height="320" fill="#0f1117"/>
  <rect x="1260" y="243" width="240" height="3" fill="#0f1117"/>

  <!-- Desk surface, lower right -->
  <rect x="760" y="640" width="840" height="260" fill="#49392d"/>
  <rect x="760" y="640" width="840" height="8" fill="#5a4938"/>

  <!-- E-ink reader device -->
  <g transform="translate(1010,300) rotate(-6)">
    <rect x="-190" y="-230" width="380" height="540" rx="26" fill="#d9d2c4"/>
    <rect x="-182" y="-222" width="364" height="524" rx="22" fill="url(#screen)"/>
    <!-- screen text: a pocket-assistant list, soft and unreadable -->
    <g fill="#9aa0a6">
      <rect x="-158" y="-196" width="316" height="10" rx="5" opacity="0.95"/>
      <rect x="-158" y="-176" width="210" height="8" rx="4" opacity="0.55"/>
      <rect x="-158" y="-128" width="316" height="12" rx="5" opacity="0.85"/>
      <rect x="-158" y="-108" width="240" height="8" rx="4" opacity="0.5"/>
      <rect x="-158" y="-60" width="316" height="12" rx="5" opacity="0.85"/>
      <rect x="-158" y="-40" width="180" height="8" rx="4" opacity="0.5"/>
      <rect x="-158" y="8" width="316" height="12" rx="5" opacity="0.85"/>
      <rect x="-158" y="28" width="140" height="8" rx="4" opacity="0.5"/>
    </g>
    <!-- warm lamp reflection on screen -->
    <rect x="-182" y="-120" width="120" height="300" fill="#e8a95b" opacity="0.10" rx="22"/>
    <rect x="-182" y="-222" width="364" height="12" fill="#c9c1b0" rx="6"/>
  </g>

  <!-- Hand holding the device (softly stylized, editorial) -->
  <g transform="translate(1010,300) rotate(-6)">
    <ellipse cx="80" cy="60" rx="120" ry="46" fill="#cfa879" opacity="0.95"/>
    <ellipse cx="22" cy="96" rx="64" ry="30" fill="#bd9a70" opacity="0.9"/>
  </g>
  <ellipse cx="1090" cy="470" rx="150" ry="60" fill="#cfa879" opacity="0.85"/>
  <ellipse cx="1135" cy="520" rx="170" ry="80" fill="#bd9a70" opacity="0.8"/>

  <!-- Warm lamp, upper right of device -->
  <g transform="translate(1220,260)">
    <path d="M-14,0 L14,0 L30,120 L-30,120 Z" fill="#7a4d22"/>
    <rect x="-30" y="150" width="60" height="14" rx="4" fill="#5b3a1c"/>
    <ellipse cx="0" cy="128" rx="60" ry="34" fill="#ffd691" opacity="0.9"/>
    <rect x="0" y="-6" width="8" height="60" fill="#8a5c2a"/>
  </g>

  <!-- Negative space: tagline top-left -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f2efe9">
    <text x="120" y="360" font-size="84" letter-spacing="1">Your calm Kindle</text>
    <text x="120" y="446" font-size="84" letter-spacing="1">can also be <tspan fill="#e8a95b" font-style="italic">useful.</tspan></text>
    <text x="120" y="530" font-size="34" fill="#c7c1b4">Clock · Timer · On-screen chat · XMPP messenger</text>
    <text x="120" y="580" font-size="24" fill="#8f887b">A self-contained KUAL extension. Plain shell + Python, nothing to install.</text>
    <text x="120" y="648" font-size="22" fill="#8f887b" font-style="italic">Needs a jailbroken Kindle and KUAL.</text>
  </g>
</svg>