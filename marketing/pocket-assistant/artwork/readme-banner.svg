<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171512"/>
      <stop offset="0.55" stop-color="#3a322c"/>
      <stop offset="1" stop-color="#24262e"/>
    </linearGradient>
    <radialGradient id="lampglow" cx="0.22" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#e8a95b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8a95b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f2ec"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#dusk)"/>
  <rect width="1600" height="400" fill="url(#lampglow)"/>

  <!-- Warm lamp, left edge -->
  <g transform="translate(130,150)">
    <path d="M-11,0 L11,0 L24,96 L-24,96 Z" fill="#7a4d22"/>
    <rect x="-24" y="120" width="48" height="12" rx="4" fill="#5b3a1c"/>
    <ellipse cx="0" cy="104" rx="48" ry="27" fill="#ffd691" opacity="0.9"/>
    <rect x="0" y="-5" width="7" height="46" fill="#8a5c2a"/>
  </g>

  <!-- E-ink reader glyph on the desk -->
  <g transform="translate(300,175) rotate(-4)">
    <rect x="-60" y="-85" width="120" height="190" rx="16" fill="#d9d2c4"/>
    <rect x="-54" y="-79" width="108" height="178" rx="13" fill="url(#screen)"/>
    <g fill="#9aa0a6">
      <rect x="-42" y="-66" width="84" height="7" rx="3" opacity="0.95"/>
      <rect x="-42" y="-53" width="58" height="6" rx="3" opacity="0.55"/>
      <rect x="-42" y="-30" width="84" height="9" rx="4" opacity="0.85"/>
      <rect x="-42" y="-17" width="62" height="6" rx="3" opacity="0.5"/>
    </g>
    <rect x="-54" y="-79" width="108" height="10" fill="#c9c1b0" rx="5"/>
  </g>

  <!-- Tagline, right side negative space -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="480" y="185" font-size="54" fill="#f2efe9">Your calm Kindle can also be <tspan fill="#e8a95b" font-style="italic">useful.</tspan></text>
    <text x="480" y="250" font-size="26" fill="#c7c1b4">Clock · Timer · On-screen chat · XMPP messenger — plain shell + Python.</text>
    <text x="480" y="300" font-size="20" fill="#8f887b" font-style="italic">Self-contained KUAL extension. Needs a jailbroken Kindle and KUAL.</text>
  </g>
</svg>